<title>Bunyy Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wiki de fãs da HQ e novel BUNYY, de Toom: personagens, capítulos, mundo e mistérios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comic+Neue:wght@700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&family=Outfit:wght@500;700;800&display=swap">
<style>
@font-face { font-family: "Warning"; src: url(data:font/woff2;base64,/*__WARNING__*/) format("woff2"); font-display: swap; }
/* Layout: cabeçalho branco + faixa de abas (HQs, Novels…) + início em grade estilo wiki (destaques à esquerda, painel do logo à direita) */
:root {
  color-scheme: light;
  --bg: #eef3f9;
  --panel: #ffffff;
  --soft: #f3f7fb;
  --tab: #e3ebf4;
  --tab-hover: #d5e1ee;
  --ink: #111a26;
  --muted: #53627a;
  --line: #d3deeb;
  --teal: #0d3b73;
  --teal-2: #1565b3;
  --teal-soft: rgba(21,101,179,0.09);
  --navy: #0a1730;
  --navy-2: #13264a;
  --cyan: #4fd3f2;
  --spark: #b02a6b;
  --spark-soft: rgba(176,42,107,0.08);
  --night: #0a1730;
  --balloon: #ffffff;
  --balloon-ink: #15121f;
  --logo: "Warning", "Unbounded", "Arial Black", sans-serif;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --comic: "Comic Neue", "Comic Sans MS", "Chalkboard SE", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 20px; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; margin: 0; }
a { color: var(--teal-2); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- cabeçalho ---------- */
.top { background: var(--navy); color: #e6eefb; }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { width: 120px; height: 30px; object-fit: contain; }
.brand b { font-family: var(--logo); font-weight: 400; font-size: 32px; line-height: 1; padding-top: 0.2em; color: #ffffff; }
.brand i { font-family: var(--logo); font-style: normal; font-size: 32px; line-height: 1; padding-top: 0.2em; color: var(--cyan); }
.search { flex: 1; min-width: 0; max-width: 380px; margin-left: auto; }
.search input { width: 100%; font: inherit; font-size: 15px; color: #ffffff; background: var(--navy-2); border: 1px solid #2a4370; border-radius: 999px; padding: 9px 16px; }
.search input::placeholder { color: #a9b9d4; }

/* ---------- abas ---------- */
.tabs-band { background: var(--navy); border-top: 1px solid #1d3360; }
.tabs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 22px; }
.tabs a { display: block; padding: 11px 0 9px; color: #cfdcf2; text-decoration: none; font-family: "Outfit", var(--body); font-weight: 500; font-size: 16px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: #ffffff; }
.tabs a[aria-current="page"] { color: #ffffff; border-bottom-color: var(--cyan); }

main { padding-block: 18px 56px; min-width: 0; }
main:focus { outline: none; }

/* ---------- início ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "new spoil side" "eds eds side" "cats cats side"; gap: 14px; align-items: start; }
.feat { grid-column: auto; position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; padding: 14px; border: 1px solid var(--line); color: #ffffff; text-decoration: none; overflow: hidden; background-color: var(--night); background-size: cover; background-position: center; }
.feat.new { grid-area: new; background-image: linear-gradient(180deg, rgba(13,27,36,0.15), rgba(13,27,36,0.85)), repeating-linear-gradient(115deg, transparent 0 46px, rgba(82,214,224,0.10) 46px 48px), radial-gradient(circle at 70% 30%, #1f5c74 0, #0d1b24 70%); }
.feat.spoil { grid-area: spoil; background-image: linear-gradient(180deg, rgba(13,27,36,0.1), rgba(13,27,36,0.9)), repeating-linear-gradient(65deg, transparent 0 38px, rgba(240,106,168,0.10) 38px 40px), radial-gradient(circle at 30% 30%, #4a1c39 0, #0d1b24 72%); }
.feat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.feat-head h2 { font-family: var(--body); font-weight: 700; font-size: 17px; margin: 0; line-height: 1.3; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.flag { flex: none; font-size: 13px; font-weight: 700; padding: 3px 8px; color: #ffffff; }
.flag.green { background: #2e8b3a; }
.flag.pink { background: #8e2a7c; }
.feat-body { font-size: 15px; line-height: 1.45; max-width: 36ch; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.feat-body a { color: #ffffff; }
.feat.has-img { background-image: var(--img) !important; }
.feat.has-img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.8)); }
.feat > * { position: relative; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips a { font-size: 14px; color: #ffffff; text-decoration: none; background: rgba(0,0,0,0.55); padding: 3px 9px; }
.chips a:hover { background: rgba(0,0,0,0.8); }
.reveal-wrap { position: relative; }
.blurred { filter: blur(7px); user-select: none; pointer-events: none; }
.reveal { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content; font: inherit; font-weight: 700; font-size: 14px; color: #ffffff; background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.6); padding: 7px 14px; cursor: pointer; }
.reveal:hover { background: rgba(0,0,0,0.85); }

.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.box { border: 1px solid var(--line); background: var(--panel); padding: 16px; }
.box h3 { font-family: var(--body); font-size: 18px; font-weight: 700; margin: 0 0 10px; }
.logo-big { width: 100%; max-width: 300px; margin: 0 auto 14px; text-align: center; }
.logo-big .lb-bunyy { display: block; font-family: var(--logo); font-size: 64px; line-height: 1; padding-top: 0.28em; color: var(--teal); }
.logo-big .lb-sw { position: relative; margin-top: 18px; background: #14202a; border-radius: 10px; padding: 14px 16px; box-shadow: inset 0 0 0 2px var(--teal); }
.logo-big svg { display: block; width: 100%; height: auto; }
.logo-big .lb-wiki { display: block; text-align: center; font-family: var(--logo); font-size: 34px; line-height: 1; padding-top: 0.3em; margin-top: 4px; color: #ffffff; letter-spacing: 0.08em; }
.welcome { font-size: 15px; margin: 0 0 12px; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.stats b { color: var(--teal); }
.social { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.social a { display: block; text-align: center; padding: 10px 6px; font-weight: 700; font-size: 14px; color: #ffffff; text-decoration: none; }
.social .fl { background: var(--teal); }
.social .yt { background: #c4302b; }
.facts { margin: 0 0 12px; padding-left: 18px; font-size: 15px; }
.facts li { margin-bottom: 8px; }
.btn-full { display: block; width: 100%; font: inherit; font-weight: 700; font-size: 15px; padding: 9px; background: var(--tab); border: 1px solid #c5ccd1; color: var(--ink); cursor: pointer; text-align: center; text-decoration: none; }
.btn-full:hover { background: var(--tab-hover); }

.eds { grid-area: eds; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ed { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }
.ed .ic { flex: none; width: 34px; height: 34px; color: var(--teal); }
.ed div { min-width: 0; }
.ed a.t { display: block; font-weight: 700; font-style: italic; }
.ed span { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; }

.cats { grid-area: cats; border: 1px solid var(--line); padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.cat { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ink); background: var(--tab); border: 1px solid #c5ccd1; border-bottom-width: 3px; }
.cat:hover { background: var(--tab-hover); }
.cat .art { width: 100%; display: grid; place-items: center; padding: 16px 0 12px; color: var(--teal); }
.cat .art svg { width: 44px; height: 44px; }
.cat b { display: block; width: 100%; text-align: center; font-size: 14px; padding: 8px 4px; background: var(--panel); border-top: 1px solid #c5ccd1; }

/* ---------- início (vitrine) ---------- */
.v-home { display: flex; flex-direction: column; gap: 38px; padding-top: 10px; }
.v-hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.v-hero-txt { flex: 1 1 420px; min-width: 0; }
.v-eyebrow { margin: 0 0 8px; font-family: "Outfit", var(--body); font-weight: 700; color: var(--teal-2); letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; }
.v-hero h1 { margin: 0 0 14px; font-family: "Outfit", var(--body); font-size: clamp(32px, 5vw, 50px); line-height: 1.05; font-weight: 800; color: var(--navy); text-wrap: balance; }
.v-hero p.lead { margin: 0 0 16px; font-size: 18px; line-height: 1.55; color: #33425a; max-width: 52ch; }
.v-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 20px; font-size: 15px; color: var(--muted); }
.v-stats b { color: var(--navy); font-size: 18px; }
.v-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.v-btn { display: inline-block; padding: 13px 22px; border-radius: 999px; font-family: "Outfit", var(--body); font-weight: 700; font-size: 16px; text-decoration: none; background: var(--teal-2); color: #ffffff; border: 2px solid var(--teal-2); }
.v-btn:hover { background: var(--teal); border-color: var(--teal); }
.v-btn.ghost { background: transparent; color: var(--teal-2); }
.v-btn.ghost:hover { background: var(--teal-soft); }
.v-hero-img { flex: 0 1 460px; width: 460px; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 20px; background: var(--navy); box-shadow: 0 0 0 4px var(--cyan); }
.v-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.v-head h2 { margin: 0; font-family: "Outfit", var(--body); font-size: 27px; font-weight: 800; color: var(--navy); }
.v-head a { font-weight: 700; }
.v-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
.v-shelf a { position: relative; display: flex; flex-direction: column; gap: 8px; color: var(--ink); text-decoration: none; }
.v-shelf img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--navy); transition: transform .15s; }
.v-shelf a:hover img { transform: translateY(-3px); }
.v-shelf b { font-family: "Outfit", var(--body); font-weight: 700; font-size: 15px; line-height: 1.3; }
.v-shelf small { color: var(--muted); font-size: 13px; }
.v-new { position: absolute; top: 8px; left: 8px; background: var(--cyan); color: var(--navy); font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.v-cards { display: flex; flex-wrap: wrap; gap: 20px; }
.v-card { flex: 1 1 320px; min-width: 0; background: var(--panel); border-radius: 18px; padding: 22px 24px; border: 1px solid var(--line); }
.v-card h2 { margin: 0 0 12px; font-family: "Outfit", var(--body); font-size: 22px; font-weight: 800; color: var(--navy); }
.v-card ul { margin: 0 0 14px; padding-left: 20px; line-height: 1.6; font-size: 16px; }
.v-card li { margin-bottom: 8px; }
.v-card.dark { background: var(--navy); border-color: var(--navy); color: #dbe6f7; }
.v-card.dark h2 { color: #ffffff; }
.v-card.dark a { color: var(--cyan); }
.v-pill { display: inline-block; font: inherit; font-family: "Outfit", var(--body); font-weight: 700; font-size: 15px; padding: 9px 18px; border-radius: 999px; background: var(--tab); border: 0; color: var(--navy); cursor: pointer; text-decoration: none; }
.v-pill:hover { background: var(--tab-hover); }
.v-faces { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.v-faces a { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; text-align: center; text-decoration: none; }
.v-faces img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 50%; background: #0e1f3d; border: 2px solid #2a4370; }
.v-faces a:hover img { border-color: var(--cyan); }
.v-news { list-style: none; padding: 0 !important; }
.v-news li { display: flex; gap: 12px; }
.v-news time { flex: none; width: 74px; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
.v-spoil { background: var(--navy); color: #dbe6f7; border-radius: 18px; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.v-spoil h2 { margin: 0; font-family: "Outfit", var(--body); font-size: 20px; color: #ffffff; flex: none; }
.v-spoil .reveal-wrap { flex: 1 1 360px; min-width: 0; min-height: 44px; }
.v-spoil a { color: var(--cyan); }
.v-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.v-cats a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--navy); font-weight: 700; text-decoration: none; }
.v-cats a:hover { border-color: var(--teal-2); }
.v-cats svg { width: 26px; height: 26px; flex: none; color: var(--teal-2); }

/* ---------- mapa da jornada ---------- */
.mp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; }
.mp-bar label { font-weight: 700; }
.mp-bar select { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-height: 44px; }
.mp-note { font-size: 14px; color: var(--muted); }
.mp-wrap { overflow-x: auto; border-radius: 18px; background: var(--navy); }
.mp-svg { display: block; width: 100%; min-width: 760px; height: auto; }
.mp-stop { cursor: pointer; }
.mp-stop:focus { outline: none; }
.mp-stop:focus-visible .mp-ring, .mp-stop:hover .mp-ring { stroke: #ffffff; stroke-width: 3; }
.mp-stop.sel .mp-ring { stroke: #ffd36b; stroke-width: 4; }
.mp-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.mp-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mp-legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--cyan); }
.mp-legend i.dash { border-top: 3px dashed #6c83ad; }
.mp-card { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
.mp-card h2 { margin: 0 0 4px; font-family: "Outfit", var(--body); font-size: 24px; font-weight: 800; color: var(--navy); }
.mp-card .mp-when { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.mp-card p { margin: 0 0 10px; }
.mp-who { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.mp-who a { font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--teal-soft); text-decoration: none; }
.mp-list { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; counter-reset: st; }
.mp-list button { text-align: left; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; min-height: 44px; }
.mp-list button:hover { border-color: var(--teal-2); }
.mp-list button[disabled] { color: var(--muted); cursor: default; background: var(--soft); }
.mp-list b { color: var(--teal-2); margin-right: 6px; }

/* ---------- índices das abas ---------- */
.idx h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); margin: 6px 0 6px; text-wrap: balance; }
.idx > p { max-width: 70ch; color: var(--muted); margin: 0 0 18px; }
.idx h2 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 26px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; text-decoration: none; color: var(--ink); min-width: 0; }
.tile:hover { border-color: var(--teal-2); }
.tile b { font-size: 16px; line-height: 1.3; }
.tile small { color: var(--muted); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.tile.has-img { position: relative; justify-content: flex-end; min-height: 150px; padding: 0; overflow: hidden; background: var(--navy); border: 0; border-bottom: 3px solid var(--teal-2); }
.tile.has-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transition: transform .35s ease; }
.tile.has-img .tile-txt { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 44px 14px 12px; background: linear-gradient(to top, rgba(10,23,48,.94) 0%, rgba(10,23,48,.78) 50%, rgba(10,23,48,0) 100%); }
.tile.has-img b { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.tile.has-img small { color: #d3e4f5; }
.tile.has-img:hover { border-bottom-color: var(--cyan); }
.tile.has-img:hover img { transform: scale(1.05); }
.grid.big { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.big .tile.has-img { min-height: 190px; }
.also { columns: 2 260px; padding-left: 20px; }

/* ---------- verbete ---------- */
.crumb { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 6px; }
.crumb a { color: inherit; }
article h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4.6vw, 40px); line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.subtitle { color: var(--muted); margin: 0 0 12px; font-size: 17px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.badge { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); }
.badge.spoiler { border-color: var(--spark); color: var(--spark); background: var(--spark-soft); }
.badge.canon { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
.content { font-size: 17px; }
.pg { display: grid; grid-template-columns: minmax(0, 72ch) 300px; gap: 36px; align-items: start; }
.pg-main { min-width: 0; }
.pg-side { position: sticky; top: 16px; }
.pg-side .infobox, .pg-side .pic { float: none; width: auto; margin: 0; }
.pg-solo { max-width: 76ch; }
.content h3.dc-h { font-size: 16px; margin: 20px 0 6px; color: var(--teal); }
.content h3.dc-h small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.versoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 0 0 18px; }
.versoes figure { margin: 0; border: 1px solid var(--line); background: #14171f; border-radius: 6px; overflow: hidden; }
.versoes img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: top; }
.versoes figcaption { font-size: 13px; color: #d6dde2; padding: 7px 10px; line-height: 1.35; }
.versoes a { display: block; }
.content::after { content: ""; display: block; clear: both; }
.content h2 { font-family: var(--display); font-weight: 700; font-size: 21px; margin: 34px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.content h3 { font-size: 18px; margin: 22px 0 6px; }
.content p { margin: 0 0 14px; }
.content ul { margin: 0 0 14px; padding-left: 22px; }
.content li { margin-bottom: 4px; }
.content dl { margin: 0 0 14px; }
.content dt { font-weight: 700; margin-top: 8px; }
.content dd { margin: 0 0 4px 18px; }
.nolink { border-bottom: 1px dotted var(--muted); }
a.cap { font-family: var(--mono); font-size: 11px; font-weight: 500; text-decoration: none; color: var(--teal); background: var(--teal-soft); padding: 1px 5px; margin-left: 3px; white-space: nowrap; vertical-align: 2px; }
a.cap:hover { background: var(--teal); color: #ffffff; }
a.cap.hqcap { color: var(--spark); background: var(--spark-soft); }

      h += "<h2>Do autor</h2><p class=\"src-note\">Das páginas extras que o Toom publica no fim dos capítulos da HQ.</p>";
      (DATA.acurios || []).forEach(function (c) {
        h += '<h3><a href="#' + c.s + '">' + esc(c.t) + "</a></h3><ul>" + c.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
      });
      if ((DATA.dcurios || []).length) {
        h += "<h2>Do Discord</h2><p class=\"src-note\">Respostas do Toom aos fãs no servidor oficial. Ele às vezes brinca ou muda de ideia, então vale conferir a data.</p><ul>" +
          DATA.dcurios.map(function (c) { return c.h.replace("</li>", ' <a href="#' + c.s + '" style="font-size:13px">ver página</a></li>'); }).join("") + "</ul>";
      }
      h += "<h2>Dos capítulos</h2>";
      (DATA.curios || []).forEach(function (c) {
        h += '<h3><a href="#' + c.s + '">' + esc(c.t) + "</a></h3><ul>" + c.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
      });
      h += "</div>";
    } else if (k === "personagens") {
      h += "<h1>Personagens</h1><p>Todos os personagens com página nesta wiki, separados pelo lado em que estão na história até o capítulo 10.</p>";
      var LADOS = ["Ordem do Fogo", "Aliados", "Domínio Sombrio", "Entidades", "Outros"];
      var chars = groups["Personagens"] || [];
      LADOS.forEach(function (l) {
        var lst = chars.filter(function (p) { return (LADOS.indexOf(p.lado) >= 0 ? p.lado : "Outros") === l; });
        if (lst.length) h += "<h2>" + l + "</h2>" + tiles(lst);
      });
      h += "<h2>Grupos de personagens</h2>" + tiles((groups["Grupos"] || []).filter(function (p) { return p.lado === "Personagens"; }));
    } else if (k === "lugares") {
      h += "<h1>Lugares</h1><p>Cidades, florestas, reinos e dimensões onde a história acontece.</p>" + tiles(groups["Lugares"]);
    } else if (k === "o-mundo") {
      h += "<h1>O Mundo</h1><p>Como a magia funciona, de onde vêm as sombras e as regras que movem a história.</p>";
      h += tiles((groups["Conceitos"] || []).filter(function (p) { return p.s !== "bestas"; }));
      h += "<h2>A obra</h2>" + tiles(groups["Sobre"] || []);
    } else if (k === "mapa") {
      h += "<h1>Mapa da jornada</h1><p>Por onde a Ordem do Fogo já passou no Arco I, da largada da prova até o Domínio Sombrio. As direções (norte, sul, leste) seguem a leitura da comunidade sobre a obra, com um pouco de imaginação: o Toom nunca mostrou um mapa oficial, então nada aqui está em escala.</p>";
      h += '<div class="mp-bar"><label for="mpNv">Li até</label><select id="mpNv">' + DATA.novel.map(function (c) {
        var hq = c.hq.length ? "HQ " + c.hq.join(" e ") : "só na novel";
        return '<option value="' + c.n + '"' + (c.n === mapNv ? " selected" : "") + ">Novel, cap. " + c.n + " (" + hq + ")</option>";
      }).join("") + '</select><span class="mp-note">Paradas depois do ponto escolhido ficam escondidas.</span></div>';
      h += '<div id="mpBody">' + mapBody() + "</div>";
    } else if (k === "criaturas") {
      var cr = groups["Criaturas"] || [];
      h += "<h1>Bestas e criaturas</h1><p>Os bichos do mundo de Bunyy: os que têm nome e as espécies que já apareceram na história. Para entender o que é uma besta e como funciona a classificação de perigo, veja " + L("bestas", "Bestas") + ".</p>";
      var named = cr.filter(function (p) { return p.tipo === "Com nome"; }), spc = cr.filter(function (p) { return p.tipo !== "Com nome"; });
      if (named.length) h += "<h2>Criaturas com nome</h2><p class=\"src-note\">Bichos de estimação, mascotes e outras criaturas secundárias que ganharam nome.</p>" + tiles(named, "big");
      if (spc.length) h += "<h2>Espécies</h2>" + tiles(spc);
      h += "<h2>Só citadas</h2><ul class=\"also\"><li><b>Tartaruga elemental gigante</b>, pacífica</li><li><b>Trolls</b></li><li><b>Decompositores</b></li><li><b>Matinta pereira</b>, pássaro mágico que parece uma velha</li><li><b>Pelosos</b>, lobos sem olhos</li><li><b>Olho de dragão</b></li></ul><p>Mais detalhes em " + L("bestas", "Bestas") + ".</p>";
    } else if (k === "grupos") {
      h += "<h1>Grupos</h1><p>Equipes, tripulações, cortes e organizações.</p>" + tiles(groups["Grupos"]);
    }
    return h + "</section>";
  }

  function figure(cls, src, cap) {
    return '<figure class="' + cls + '"><a href="' + esc(src) + '" target="_blank" rel="noopener" title="Abrir imagem inteira"><img src="' + esc(src) + '" alt="' + esc(cap || "") + '" loading="lazy"></a>' + (cap ? "<figcaption>" + esc(cap) + "</figcaption>" : "") + "</figure>";
  }
  function withImages(p) {
    var im = pageImg(p.s), h = p.h;
    if (im.foto) {
      if (h.indexOf('class="infobox"') >= 0) h = h.replace("</div><dl>", "</div>" + figure("ib-img", im.foto, im.legenda) + "<dl>");
      else h = figure("pic", im.foto, im.legenda) + h;
    }
    var gal = (im.galeria || []).filter(function (g) { return g && g.arquivo; });
    if (gal.length) h += '<h2 id="galeria">Galeria</h2><div class="gallery">' + gal.map(function (g) { return figure("", g.arquivo, g.legenda); }).join("") + "</div>";
    var vs = (im.versoes || []).filter(function (g) { return g && g.arquivo; });
    if (vs.length) h += '<h2 id="versoes">Outras versões</h2><p class="src-note">Como ' + esc(p.t) + ' aparece em outras artes oficiais: capas e ilustrações das novels. Clique para ver inteira.</p><div class="versoes">' + vs.map(function (g) { return figure("", g.arquivo, g.legenda); }).join("") + "</div>";
    var tmp = document.createElement("div"); tmp.innerHTML = h;
    var side = tmp.querySelector(".infobox") || tmp.querySelector(":scope > .pic");
    if (!side) return '<div class="pg-solo">' + h + "</div>";
    side.parentNode.removeChild(side);
    return '<div class="pg"><div class="pg-main">' + tmp.innerHTML + '</div><aside class="pg-side">' + side.outerHTML + "</aside></div>";
  }
  function readbar(p) {
    var m = /^capitulo-(\d+)$/.exec(p.s);
    if (!m) return "";
    var n = parseInt(m[1], 10), nv = cfg("novel." + n);
    var ent = (DATA.novel || []).filter(function (x) { return x.n === n; })[0] || { hq: [] };
    var hqs = ent.hq.length ? ent.hq.map(function (x) {
      return '<a class="hq" href="https://fliptru.com.br/comic/bunyy/' + ("00" + x).slice(-3) + '" target="_blank" rel="noopener">Ler a HQ, cap. ' + x + "</a>";
    }).join("") : "<span>Ainda não está na HQ</span>";
    return '<div class="readbar">' + hqs +
      (nv ? '<a class="nv" href="' + esc(nv) + '" target="_blank" rel="noopener">Ler a novel</a>' : "<span>Novel: link em breve</span>") + "</div>";
  }

  function page(p) {
    var t = tabOf(p), tabT = TABS.filter(function (x) { return x.k === t; })[0];
    var badges = '<div class="badges">';
    if (p.sp) badges += '<span class="badge spoiler">Spoilers até o ' + esc(p.sp) + "</span>";
    if (p.f === "novel") badges += '<span class="badge canon">Fonte: obra oficial</span>';
    if (p.f === "discord") badges += '<span class="badge dc">Fonte: falas do Toom no Discord</span>';
    badges += "</div>";
    return '<article><p class="crumb">' + (tabT ? '<a href="#' + tabT.k + '">' + tabT.t + "</a>" : "") + "</p><h1>" + esc(p.t) + "</h1>" +
      (p.sub ? '<p class="subtitle">' + esc(p.sub) + "</p>" : "") + badges + readbar(p) + '<div class="content">' + withImages(p) + "</div>" +
      '<p class="fix-bar">Achou um erro ou tem algo a acrescentar nesta página? <a href="#contribuir/' + p.s + '">Avise a gente</a>.</p></article>';
  }

  function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function search(term) {
    var t = norm(term.trim());
    var res = pages.map(function (p) {
      var inTitle = norm(p.t).indexOf(t) >= 0, idx = norm(p.x).indexOf(t);
      return { p: p, score: inTitle ? 2 : idx >= 0 ? 1 : 0, idx: idx };
    }).filter(function (r) { return r.score; }).sort(function (a, b) { return b.score - a.score; });
    var h = '<article><p class="crumb">Busca</p><h1>Resultados para “' + esc(term.trim()) + "”</h1>";
    if (!res.length) return h + '<p class="subtitle">Nada encontrado. Tente o nome de um personagem ou lugar.</p></article>';
    h += '<p class="subtitle">' + res.length + (res.length === 1 ? " página" : " páginas") + '</p><ul class="results">';
    res.slice(0, 40).forEach(function (r) {
      var snip = "";
      if (r.idx >= 0) {
        var a = Math.max(0, r.idx - 60), raw = r.p.x.slice(a, r.idx + t.length + 90), at = r.idx - a;
        snip = (a ? "…" : "") + esc(raw.slice(0, at)) + "<mark>" + esc(raw.slice(at, at + t.length)) + "</mark>" + esc(raw.slice(at + t.length)) + "…";
      } else if (r.p.sub) { snip = esc(r.p.sub); }
      h += '<li><a href="#' + r.p.s + '"><b>' + esc(r.p.t) + "</b><small>" + snip + "</small></a></li>";
    });
    return h + "</ul></article>";
  }

  function setTab(k) {
    document.querySelectorAll("#tabs a").forEach(function (a) {
      if (a.getAttribute("data-k") === k) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  function wireHome() {
    var btn = document.getElementById("reveal");
    if (btn) btn.addEventListener("click", function () {
      document.getElementById("spoilText").classList.remove("blurred");
      document.getElementById("spoilChips").hidden = false;
      btn.remove();
    });
    var more = document.getElementById("moreFacts");
    if (more) more.addEventListener("click", function () {
      factStart = (factStart + 3) % FACTS.length;
      document.getElementById("facts").innerHTML = factsHtml();
    });
  }

  var TABKEYS = TABS.map(function (t) { return t.k; });
  function render() {
    var s = (location.hash || "").slice(1) || "inicio";
    var ctx = "";
    if (s.indexOf("contribuir/") === 0) { ctx = s.slice(11); s = "contribuir"; }
    var p = bySlug[s];
    if (p) { main.innerHTML = page(p); setTab(tabOf(p)); document.title = p.t + " · Bunyy Wiki"; }
    else if (TABKEYS.indexOf(s) >= 0) { main.innerHTML = tabPage(s, ctx); setTab(s); document.title = TABS[TABKEYS.indexOf(s)].t + " · Bunyy Wiki"; if (s === "mapa") wireMap(); if (s === "linha-do-tempo") wireLinha(); }
    else { main.innerHTML = home(); setTab(null); document.title = "Bunyy Wiki"; wireHome(); }
    window.scrollTo(0, 0);
  }

  var timer;
  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (q.value.trim().length >= 2) { main.innerHTML = search(q.value); setTab(null); }
      else render();
    }, 120);
  });
  window.addEventListener("hashchange", function () { q.value = ""; render(); main.focus({ preventScroll: true }); });
  render();
})();
</script>
