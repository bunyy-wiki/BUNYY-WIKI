fatos:
- texto: … que [Bunyy](#bunyy-grimm) diz não odiar nada além de peixes?{cap 1}
- texto: … que [Merlin](#merlin), o Guerreiro Lendário, tinha pavor de baratas?{cap 7}
- texto: … que [Norman](#norman) batizou o ovo de dragão roubado de Flávio Pereira Grimm?{cap 4}
- texto: … que a primeira Jolly Roger afundou há uns 600 anos? O navio atual é a [Jolly Roger III](#jolly-roger-iii).{cap 7}
- texto: … que [Arthur](#arthur) toma café de camomila, e já matou um servo que esqueceu o açúcar?{cap 6}
- texto: … que [Any](#any) está há dois anos sem ganhar no cara ou coroa?{cap 2}
- texto: … que o mapa da [Ordem do Fogo](#ordem-do-fogo) era um brinquedo da AventurKids?{cap 4}
- texto: … que [Onhos](#onhos-lupan) criou sozinho a língua de sinais que usa, e só Bunyy sabe traduzir?{cap 1}
- texto: … que Caronte, a tubarão de areia que puxa o navio, tem seis olhos e quatro patas?{cap 7}
- texto: … que [Mel](#mel) tem um guidra de estimação chamado Dentuço, que mora no cabelo dela?{cap 6}
- texto: … que a [Capitã Gancho](#capita-gancho) tinha um papagaio, que morreu?{cap 7}
- texto: … que [Rebeca Branco](#rebeca-branco) tem 25 anos e não quer ser chamada de senhora?{cap 1}{cap 3}
